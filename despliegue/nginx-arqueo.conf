# Sitio nginx. Copiar a /etc/nginx/sites-available/arqueo y enlazar en sites-enabled.
# Se escribe solo en HTTP: `certbot --nginx` agrega el certificado, el bloque 443 y la redirección a HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name arqueo.finanzashuentelauquen.cl;

    # Los Excel del POS pueden pesar >10 MB (nginx por defecto rechaza sobre 1 MB).
    client_max_body_size 50M;

    location /static/ {
        alias /srv/arqueo/app/staticfiles/;
        expires 7d;
    }

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Imprescindible con DJANGO_PROXY_SSL=1: sin esto Django cree que todo llega por HTTP y redirige sin fin.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
    }
}
