<!DOCTYPE html>
<html lang="es-CL">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sin perfil asignado · Hacienda Huentelauquén</title>
<style>
body{margin:0;background:#EDEDED;font-family:Carlito,Calibri,"Segoe UI",sans-serif;color:#3A3A3A;display:flex;min-height:100vh;align-items:center;justify-content:center}
.caja{background:#fff;border:1px solid #E8E8E8;border-left:4px solid #ED0035;max-width:520px;padding:32px 36px}
h1{font-family:Caladea,Cambria,Georgia,serif;color:#8C0026;font-size:24px;margin:0 0 10px}
p{line-height:1.55;font-size:14.5px}
button{background:#ED0035;color:#fff;border:0;padding:10px 18px;font-weight:700;font-size:14px;cursor:pointer;font-family:inherit}
</style>
</head>
<body>
  <div class="caja">
    <h1>Tu cuenta no tiene un perfil asignado</h1>
    <p>Puedes iniciar sesión, pero todavía no puedes ver ni hacer nada en la aplicación. Pide a la Gerente de Administración y Finanzas que te asigne un perfil.</p>
    <form method="post" action="{% url 'logout' %}">{% csrf_token %}<button type="submit">Cerrar sesión</button></form>
  </div>
</body>
</html>
