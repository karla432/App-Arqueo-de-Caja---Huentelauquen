<!DOCTYPE html>
<html lang="es-CL">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sin permiso · Hacienda Huentelauquén</title>
<style>
body{margin:0;background:#EDEDED;font-family:Carlito,Calibri,"Segoe UI",sans-serif;color:#3A3A3A;display:flex;min-height:100vh;align-items:center;justify-content:center}
.caja{background:#fff;border:1px solid #E8E8E8;border-left:4px solid #ED0035;max-width:520px;padding:32px 36px}
h1{font-family:Caladea,Cambria,Georgia,serif;color:#8C0026;font-size:24px;margin:0 0 10px}
p{line-height:1.55;font-size:14.5px}
a{color:#ED0035}
</style>
</head>
<body>
  <div class="caja">
    <h1>Tu perfil no permite esta operación</h1>
    <p>{% if exception %}{{ exception }}{% else %}No tienes permiso para hacer esto.{% endif %}</p>
    <p><a href="/">Volver al inicio</a></p>
  </div>
</body>
</html>
